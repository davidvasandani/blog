name: autoupdate
on:
  # This will trigger on all pushes to all branches.
  push: {}
  # Alternatively, you can only trigger if commits are pushed to certain branches, e.g.:
  # push:
  #   branches:
  #     - main
  #     - unstable
jobs:
  autoupdate:
    name: autoupdate
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare PR updates
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.AUTOUPDATE_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set AUTOUPDATE_TOKEN with Contents, Workflows, and Pull requests read/write access so branch updates trigger CI."
            exit 1
          fi
          # The action matches exact labels, not globs. Expand the CMS prefix.
          labels=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/labels" \
            --jq '.[].name | select(startswith("decap-cms/"))')
          echo "excluded_labels=$(printf '%s\n' "$labels" | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: docker://chinthakagodawita/autoupdate-action:v1
        env:
          # Pushes made with the default GITHUB_TOKEN don't trigger other
          # workflows, so merges pushed with it never run CI on the PR.
          # AUTOUPDATE_TOKEN is a fine-grained personal access token for this
          # repository with Contents, Workflows (needed to merge in workflow
          # changes) and Pull requests access, all read and write.
          GITHUB_TOKEN: '${{ secrets.AUTOUPDATE_TOKEN }}'
          EXCLUDED_LABELS: ${{ steps.prepare.outputs.excluded_labels }}
          # Conflicted PRs need manual resolution; keep updating other PRs.
          MERGE_CONFLICT_ACTION: "ignore"
