name: Blog tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Use the runner-installed Chrome with its supported AppArmor profile.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run gemini:server:build
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: resume/requirements.txt
      - run: pip install -r resume/requirements.txt
      - run: rendercv render David_Vasandani_CV.yaml
        working-directory: resume
      - run: test -s resume/rendercv_output/David_Vasandani_CV.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume/rendercv_output/
          if-no-files-found: error
