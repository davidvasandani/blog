name: Blog tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Use the runner-installed Chrome with its supported AppArmor profile.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run gemini:server:build
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: resume/requirements.txt
      - run: pip install -r resume/requirements.txt
      - run: rendercv render David_Vasandani_CV.yaml
        working-directory: resume
      - run: test -s resume/rendercv_output/David_Vasandani_CV.pdf
      # Build the site with the rendered resume, as Cloudflare does, and check
      # the published /resume/ page, its PDF and their accessibility.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run build && npm run gemini:build
      - run: node --test tests/resume.test.cjs
      - run: node scripts/workers-assets.cjs && npm run test:workers && npx wrangler deploy --dry-run
      - run: npm run test:a11y
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume/rendercv_output/
          if-no-files-found: error
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Clones diagram-design at the commit in diagrams/diagram-design.lock, then
      # checks sources, extractor counts, the skill's self/geometry checks and
      # that the published SVGs match a fresh export. Needs no npm install.
      - run: node scripts/diagrams.cjs setup
      - run: node scripts/diagrams.cjs check
