name: gemini-deploy
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:

  start:
    # example where instead of forming the default "cypress run ..."
    # the user can specify their own command
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Gemini Build
        run: |
          npm ci
          npm run gemini:build;

      - name: Push to Flounder Online
        # Flounder's SFTP port refuses connections, so this saves each file
        # through its HTTPS editor and fails the job if any file doesn't land.
        env:
          FLOUNDER_PASSWORD: ${{ secrets.FLOUNDER_ONLINE_PASSWORD }}
        run: node scripts/gemini-deploy.cjs
