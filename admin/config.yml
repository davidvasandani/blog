# Decap CMS Configuration File

# The backend option specifies how to access the content for your site
backend:
  name: github
  repo: davidvasandani/blog
  branch: main # The branch to update (optional; defaults to master)
  # Sign-in runs through this site's /api/auth and /api/callback, which need a
  # GitHub OAuth App; see README "CMS sign-in".
  base_url: https://david.vasandani.me
  auth_endpoint: api/auth
  auth_scope: public_repo

# Uncomment below to enable drafts https://www.decapcms.org/docs/add-to-your-site/#editorial-workflow
publish_mode: editorial_workflow

# Uncomment below to enable a link to your published site in the header bar of Decap CMS

media_folder: "static/img" # Media files will be stored in the repo under images/uploads

# Please run "npm start" for local backend
local_backend: true

collections:
  # Our blog posts
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Post" # Used in the UI
    folder: "posts" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    path: '{{slug}}/{{title}}'
    media_folder: ''
    public_folder: ''
    fields: # The fields for each document, usually in front matter
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Anonymous" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", default: ["post"] }
      - { label: "Body", name: "body", widget: "markdown" }
  # Our pages e.g. About
  - name: "pages"
    label: "Page"
    folder: "pages"
    create: false # Change to true to allow editors to create new pages
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - label: "Navigation" # https://www.11ty.dev/docs/plugins/navigation/
        name: "eleventyNavigation"
        widget: "object"
        fields:
          - { label: "Key", name: "key", widget: "string" }
          - { label: "Order", name: "order", widget: "number", default: 0 }
      - { label: "Body", name: "body", widget: "markdown" }
  # The RenderCV resume. Saving rewrites the whole file from the form, which
  # drops YAML comments and reflows long lines; see resume/README.md.
  - name: "resume"
    label: "Resume"
    delete: false
    editor:
      preview: false
    files:
      - name: "cv"
        label: "Resume"
        file: "resume/David_Vasandani_CV.yaml"
        format: "yml"
        fields:
          - label: "CV"
            name: "cv"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Website", name: "website", widget: "string", required: false }
              - label: "Social networks"
                name: "social_networks"
                widget: "list"
                required: false
                summary: "{{fields.network}}: {{fields.username}}"
                fields:
                  - { label: "Network", name: "network", widget: "string", hint: "A RenderCV network name, such as LinkedIn, GitHub or Mastodon" }
                  - { label: "Username", name: "username", widget: "string" }
              - label: "Sections"
                name: "sections"
                widget: "object"
                fields:
                  - label: "Summary"
                    name: "summary"
                    widget: "list"
                    required: false
                    field: { label: "Paragraph", name: "paragraph", widget: "text" }
                  - label: "Experience"
                    name: "experience"
                    widget: "list"
                    required: false
                    summary: "{{fields.company}}, {{fields.position}}"
                    fields:
                      - { label: "Company", name: "company", widget: "string" }
                      - { label: "Position", name: "position", widget: "string", required: false }
                      - { label: "Start date", name: "start_date", widget: "string", required: false, hint: "YYYY-MM. Use start and end dates or Date, not both." }
                      - { label: "End date", name: "end_date", widget: "string", required: false, hint: "YYYY-MM or present" }
                      - { label: "Date", name: "date", widget: "string", required: false, hint: "Free text such as 2016 – 2019, instead of start and end dates" }
                      - { label: "Location", name: "location", widget: "string", required: false }
                      - { label: "Summary", name: "summary", widget: "text", required: false }
                      - label: "Highlights"
                        name: "highlights"
                        widget: "list"
                        required: false
                        field: { label: "Highlight", name: "highlight", widget: "text" }
                  - label: "Projects"
                    name: "projects"
                    widget: "list"
                    required: false
                    summary: "{{fields.name}}"
                    fields:
                      - { label: "Name", name: "name", widget: "string" }
                      - { label: "Date", name: "date", widget: "string", required: false }
                      - { label: "Summary", name: "summary", widget: "text", required: false }
                      - label: "Highlights"
                        name: "highlights"
                        widget: "list"
                        required: false
                        field: { label: "Highlight", name: "highlight", widget: "text" }
                  - label: "Skills"
                    name: "skills"
                    widget: "list"
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Details", name: "details", widget: "text" }
          - label: "Design"
            name: "design"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Theme", name: "theme", widget: "select", options: ["classic", "ember", "engineeringclassic", "engineeringresumes", "harvard", "ink", "moderncv", "opal", "sb2nov"] }
              - label: "Entries"
                name: "entries"
                widget: "object"
                required: false
                fields:
                  - { label: "Allow page breaks inside entries", name: "allow_page_break", widget: "boolean", required: false }
              - label: "Sections"
                name: "sections"
                widget: "object"
                required: false
                fields:
                  - { label: "Show time spans in", name: "show_time_spans_in", widget: "list", required: false, hint: "Section names. Leave empty to hide elapsed durations." }
          - label: "Locale"
            name: "locale"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Language", name: "language", widget: "string", required: false }
          - label: "Settings"
            name: "settings"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Current date", name: "current_date", widget: "string", required: false, hint: "today, or a date" }
              # scripts/resume.cjs and the site build read rendercv_output, so keep it out of the form.
              - { label: "Render command", name: "render_command", widget: "hidden", required: false }
              - { label: "PDF title", name: "pdf_title", widget: "string", required: false }
