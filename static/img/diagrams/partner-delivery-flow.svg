<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="partner-delivery-flow-title partner-delivery-flow-desc" id="partner-delivery-flow-root">
        <title id="partner-delivery-flow-title">Partner content delivery, submission to launch</title>
        <desc id="partner-delivery-flow-desc">Flowchart: a partner posts a package, it is authenticated and schema-checked; an invalid package goes back to the partner for remediation and resubmission, a valid one has its metadata, artwork and video orchestrated, metadata stored, and an availability window set before it is ready to launch.</desc>
        <defs>
      <style>#partner-delivery-flow-root { --color-paper:   #fff0eb;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #b23a17;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #partner-delivery-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #partner-delivery-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#partner-delivery-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="partner-delivery-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="partner-delivery-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b23a17"/></marker>
          <marker id="partner-delivery-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0000ff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fff0eb"/>

        <!-- Connectors first, behind nodes -->
        <line x1="136" y1="168" x2="224" y2="168" stroke="#0000ff" stroke-width="1.2" marker-end="url(#partner-delivery-flow-arrow-link)"/>
        <line x1="368" y1="168" x2="416" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#partner-delivery-flow-arrow)"/>
        <line x1="544" y1="168" x2="592" y2="168" stroke="#b23a17" stroke-width="1.4" marker-end="url(#partner-delivery-flow-arrow-accent)"/>
        <line x1="480" y1="216" x2="480" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#partner-delivery-flow-arrow)"/>
        <path d="M408,312 H304 A8,8 0 0 1 296,304 V196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#partner-delivery-flow-arrow)"/>
        <line x1="768" y1="168" x2="800" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#partner-delivery-flow-arrow)"/>
        <line x1="680" y1="196" x2="680" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#partner-delivery-flow-arrow)"/>
        <line x1="768" y1="312" x2="800" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#partner-delivery-flow-arrow)"/>

        <!-- Arrow labels: opaque masks, 8px clear of their strokes -->
        <rect x="146" y="148" width="68" height="12" rx="2" fill="#fff0eb"/>
        <text x="180" y="157" fill="#0000ff" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST PACKAGE</text>
        <rect x="552" y="148" width="32" height="12" rx="2" fill="#fff0eb"/>
        <text x="568" y="157" fill="#b23a17" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="488" y="244" width="24" height="12" rx="2" fill="#fff0eb"/>
        <text x="500" y="253" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="332" y="292" width="48" height="12" rx="2" fill="#fff0eb"/>
        <text x="356" y="301" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESUBMIT</text>

        <!-- Partner: input -->
        <rect x="40" y="144" width="96" height="48" rx="20" fill="#fff0eb"/>
        <rect x="40" y="144" width="96" height="48" rx="20" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="88" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Partner</text>

        <!-- Authenticate: step -->
        <rect x="224" y="140" width="144" height="56" rx="6" fill="#fff0eb"/>
        <rect x="224" y="140" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="296" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Authenticate</text>
        <text x="296" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">submission</text>

        <!-- Schema valid?: the one focal decision -->
        <polygon points="480,120 544,168 480,216 416,168" fill="#fff0eb"/>
        <polygon points="480,120 544,168 480,216 416,168" fill="#b23a17" stroke="#b23a17" stroke-width="1" fill-opacity="0.08"/>
        <text x="480" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Schema</text>
        <text x="480" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">valid?</text>

        <!-- Orchestrate: step -->
        <rect x="592" y="140" width="176" height="56" rx="6" fill="#fff0eb"/>
        <rect x="592" y="140" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Orchestrate assets</text>
        <text x="680" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">metadata · artwork · video</text>

        <!-- Metadata store: store -->
        <rect x="800" y="140" width="120" height="56" rx="6" fill="#fff0eb"/>
        <rect x="800" y="140" width="120" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="860" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Metadata store</text>

        <!-- Remediate: step on the failure loop -->
        <rect x="408" y="284" width="144" height="56" rx="6" fill="#fff0eb"/>
        <rect x="408" y="284" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Remediate</text>
        <text x="480" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">with partner</text>

        <!-- Set availability: step -->
        <rect x="592" y="284" width="176" height="56" rx="6" fill="#fff0eb"/>
        <rect x="592" y="284" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Set availability</text>
        <text x="680" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">launch window</text>

        <!-- Ready to launch: end -->
        <rect x="800" y="288" width="120" height="48" rx="20" fill="#fff0eb"/>
        <rect x="800" y="288" width="120" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="860" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ready to launch</text>

        <!-- Legend: bottom strip -->
        <line x1="40" y1="424" x2="920" y2="424" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
        <rect x="40" y="460" width="24" height="12" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="72" y="470" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Start / end</text>
        <rect x="176" y="460" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="208" y="470" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Step</text>
        <polygon points="296,466 308,460 320,466 308,472" fill="#b23a17" stroke="#b23a17" stroke-width="1" fill-opacity="0.08"/>
        <text x="332" y="470" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Decision (focal)</text>
        <rect x="448" y="460" width="24" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="480" y="470" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Store</text>
        <line x1="560" y1="466" x2="588" y2="466" stroke="#0000ff" stroke-width="1.2" marker-end="url(#partner-delivery-flow-arrow-link)"/>
        <text x="596" y="470" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTP call</text>
        <line x1="696" y1="466" x2="724" y2="466" stroke="#b23a17" stroke-width="1.4" marker-end="url(#partner-delivery-flow-arrow-accent)"/>
        <text x="732" y="470" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Happy path</text>
      </svg>
