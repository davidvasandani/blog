# Audit the rendered public blog. The CMS loads a remote application, and its
# email templates require Netlify Identity substitutions before rendering;
# neither is a standalone public page suitable for Pa11y's file:// scan.
[[plugins]]
  package = "netlify-plugin-a11y"
  [plugins.inputs]
    checkPaths = ["/"]
    ignoreDirectories = ["admin"]
    resultMode = "error"
