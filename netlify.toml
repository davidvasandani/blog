[build]
  publish = "_site"
  # Ensure the Pa11y audit has its browser even when node_modules is restored
  # from cache without running install scripts (no-op once downloaded).
  # Then render the resume (RenderCV, Python) so eleventy publishes /resume/
  # and its PDF; a resume render failure fails the deploy.
  command = "npx puppeteer browsers install chrome && npm run resume:setup && npm run resume -- --dont-generate-png && eleventy"

[[redirects]]
  from = "/hello"
  to = "/.netlify/functions/hello"
  status = 200

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

