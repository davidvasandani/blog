cv:
  name: David Vasandani
  headline: Solutions Engineer
  location: Los Angeles, CA
  email: david@vasandani.me
  website: https://david.vasandani.me/
  social_networks:
    - network: LinkedIn
      username: davidvasandani
    - network: GitHub
      username: davidvasandani
    - network: Mastodon
      username: '@davidvasandani@social.coop'
  sections:
    summary:
      - "Hands-on engineer who works on the customer side of vendor software. Seven years at Sweetgreen, promoted three times, owning the POS, loyalty, network and device-management integrations. Uses AI to get to root cause, even inside vendor software with no source code or logs. Prototypes fast to unblock people, then builds the version that lasts so the fix isn't a one-off. Brings vendors evidence and a clear ask."
    experience:
      # Sweetgreen: one entry per role, newest first. Dates are the effective
      # dates in ChartHop's job history (Personal History tab).
      - company: Sweetgreen
        position: Senior Manager, IT Infrastructure & Innovation
        start_date: 2026-02
        end_date: present
        location: Culver City, CA
        summary: |-
          **Theme: Running IT operations, using AI to find problems and automate fixes.**

          Promoted from Senior Lead Software Engineer. Runs IT Operations, reporting to the VP of Technology.
        highlights:
          - "Manage a team of three: a Senior Systems Engineer and two IT Operations Specialists."
          # TODO: add the crash reduction once 2 weeks of post-rollout data exist (re-run ~2026-11-08).
          - Used AI to trace POS crashes that hit dozens of high-volume stores during the lunch rush. Reverse-engineered the POS executable, then shipped a workaround that starts the app on fewer cores.
          - The same work turned up loyalty-scan freezes, where a hidden reward dialog blocked the register screen. Used AI to decompile the vendor's loyalty DLL, found that it logs nothing when the reward dialog opens, and shared the findings with the vendor as evidence.
          - Directed AI agents to build documented, read-only tools that audit the POS vendor's settings across 343 locations, as often as needed.
          - Built a browser service for AI agents that stays logged in between runs. When a step needs a person, they take over the live session.
          - Replaced emailing the POS vendor to fix sales stuck on the wrong business date with an AI agent that makes the fix after a preview and a named approver's sign-off.
          - Built a tool that lets AI agents run PowerShell on POS devices and managers' back-office computers through our remote-access software. Integrated security cameras to check whether someone might be using the computer before making changes during business hours. Commands are read-only by default, changes need approval, and every command is logged.
      - company: Sweetgreen
        position: Senior Lead Software Engineer
        start_date: 2025-09
        end_date: 2026-02
        location: Culver City, CA
        summary: |-
          **Theme: Covering for retail technology leadership through POS incidents and upgrades.**

          Promoted from Lead Software Engineer.
        highlights:
          - Filled the Retail Technology leadership gap during an unplanned leave. Gave the VP of Technology the technical guidance to limit revenue loss from POS issues.
          - Took a virtual POS proof of concept through cutover planning with Security. The cutover was postponed to add telemetry first.
          - Upgraded Alteryx Server by building a replacement host and cutting over with the business's approval. Kept the old server ready for rollback.
          - After the October 2025 end-of-day outage, wrote and ran staged Ansible changes that removed scheduled reboots from the POS devices Ansible manages, so those reboots no longer interrupt end-of-day processing.
      - company: Sweetgreen
        position: Lead Software Engineer
        start_date: 2021-03
        end_date: 2025-08
        location: Culver City, CA
        summary: |-
          **Theme: Connecting restaurant systems and making their health visible.**

          Promoted from Senior Software Engineer.
        highlights:
          - Built an Ansible and Fluent Bit pipeline that ships POS logs to Datadog. It covered 222 of 252 restaurants by May 2025.
          - Built AWS Lambda and Datadog monitoring for Meraki network loss and latency and for Intune-managed time clocks, so teams could see which restaurants had network or device problems.
          - Added Cognito token caching for marketplace partners. Reported authentication costs fell from about $3,500 to $1,000 a month.
          - Defined AWS accounts in Terraform, rolled out Atlantis and view-only SSO, and turned on AWS Config with ServiceNow integration in every account.
          - Built and ran an AWS Transfer SFTP service in Terraform for file exchange with Paytronix and our POS vendor, with a separate folder for each vendor. Worked with Security to onboard vendors.
      - company: Sweetgreen
        position: Senior Software Engineer, Infrastructure
        start_date: 2019-08
        end_date: 2021-02
        location: Culver City, CA
        summary: |-
          **Theme: Making software delivery faster and safer.**

          Joined as Senior Engineer, Infrastructure. Retitled Senior Software Engineer in March 2020.
        highlights:
          - Split a Terraform monorepo that people ran from their own machines into smaller repositories, each with its own state and deployed by CircleCI. A bad change could break less, and developers shipped faster.
          - Split an Ember frontend out of a Rails backend into a static single-page app so it could deploy more often.
          - Built blue-green infrastructure on weighted AWS ALB target groups, so teams could run canary deploys and roll back fast.
          - Started and documented a tech-wide on-call rotation in OpsGenie, then led the team in improving service runbooks a little at a time.
          - Made local development easier by adding LocalStack and hot reloading, and set up bastion access through IAM.
          - Brought in Gruntwork's reusable, production-tested infrastructure modules to make our infrastructure code easier to maintain.
          - Pushed for Datadog and led its rollout. Monitoring moved into one place, and costs went down.
          - Standardized infrastructure and deploys across 15+ services, so new services launched sooner and new engineers got up to speed faster.
      - company: LearnZillion
        position: Senior Operations Engineer
        date: 2016 – 2019
        location: Remote
        highlights:
          - Moved Elasticsearch, Redis and Postgres off self-managed EC2 instances onto Amazon Elasticsearch Service, ElastiCache and RDS, which were more reliable and less work to run.
          - Cut infrastructure costs by moving test environments to ECS on Spot Fleet and buying short-term Reserved Instances.
          - Set developers up with Docker for Mac and upgraded CI from CircleCI 1.0 to 2.0.
      - company: Humanitarian OpenStreetMap Team
        position: Senior Systems Engineer
        date: 2016 – 2018
        location: Remote
        highlights:
          - Moved apps off a hand-built cloud server running an old Docker version onto a Docker Swarm cluster built with Ansible and Terraform, deployed continuously from CircleCI.
          - Ran weekly community meetings to tell stakeholders what was changing.
      - company: Warby Parker
        position: Automation Engineer
        date: 2014 – 2016
        location: New York, NY
        highlights:
          - Designed an AWS VPC with security as the first requirement and moved our Rackspace Public Cloud instances into it.
          - Moved to immutable infrastructure built with Packer, Ansible, Terraform and Consul, with auto scaling groups and blue-green and canary deploys.
          - Auto-scaled application servers on CloudWatch CPU and memory metrics and worker servers on queue depth.
          - Monitored servers with collectd and services with Consul, alerting through Sensu.
          - Increased deployments from once a week to over 400 a month over two years.
          - Cut the infrastructure bill by over 40% by rightsizing servers and autoscaling.
    open_source:
      - name: Self-hosted AI coding platform (fork of Vibe Kanban)
        date: 2026
        summary: Built for my own use. Work adopted it, and I'm now onboarding my team.
        highlights:
          - Connected it to Jira, Slack, GitHub, AWS and ChatGPT, so agents can finish work without someone logging in for them or copying tickets over by hand.
          - Grew it from one machine into a 6-server cluster. Agent work survives restarts, and the cluster opens its own repair tickets.
          - Designed it and directed Claude and Codex agents to build it. Every change starts as a written spec, then gets a review and automated tests before release.
      - name: SitePing web feedback platform
        date: 2026
        highlights:
          - Made an open-source website feedback tool work on phones, directing AI agents to write the change and 48 regression tests. Upstream shipped it in v0.11.0.
    projects:
      - name: Household content and workflow platform
        summary: Personal project, built with AI coding agents.
        highlights:
          - Built media and metadata imports for a household archive. Imports pick up where they stopped, check attachments, and have controls to recover failed runs.
          - Got stalled imports running again by fixing credentials and using the recovery triggers. That brought in 62 new items and requeued 63 failed downloads.
          - Automated email triage. Jev sorts each message into Johnny.Decimal labels, a separate check confirms each action, and my corrections tune it.
    skills:
      - label: Infrastructure as Code
        details: Terraform, Terragrunt, Packer, Ansible, Consul, Vault
      - label: AWS
        details: ECS, Elastic Beanstalk, CloudWatch, Auto Scaling, Spot Fleet, DMS, IAM, App Mesh, CodePipeline
      - label: Containers
        details: Docker, Kubernetes, Helm, ChartMuseum, Rancher, ALB and NGINX ingress controllers
      - label: CI/CD & Observability
        details: CircleCI, Datadog, OpsGenie, Sensu
      - label: Collaboration
        details: Documentation, workflow management, lecturing, mentoring
