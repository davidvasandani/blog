      - label: IT operations & observability
        details: PowerShell, Intune, Meraki, Datadog, Fluent Bit, incident response, on-call runbooks
      - label: Data & content workflows
        details: Export validation, metadata extraction, deduplication, resumable imports
      - label: Technical leadership
        details: Team management, vendor escalation, stakeholder communication, rollout and rollback planning
