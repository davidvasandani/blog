  sections:
    summary:
      - "Hands-on engineer at the boundary between a company and its vendors. Seven years at Sweetgreen, promoted three times, owning POS, loyalty, network and device-management integrations. Uses AI to get to root cause, even inside vendor software with no source code or logs. Prototypes fast to unblock people, then turns what works into sustainable platforms so fixes don't stay one-offs. Brings vendors evidence and a clear ask."
    experience:
      # Sweetgreen: one entry per role, newest first. Dates are the effective
      # dates in ChartHop's job history (Personal History tab).
      - company: Sweetgreen
        position: Senior Manager, IT Infrastructure & Innovation
        start_date: 2026-02
        end_date: present
        location: Culver City, CA
        summary: Promoted from Senior Lead Software Engineer. Runs IT Operations, reporting to the VP of Technology.
        highlights:
          - Manage a team of three, a Senior Systems Engineer and two IT Operations Specialists.
          # TODO: add the crash reduction once 2 weeks of post-rollout data exist (re-run ~2026-11-08).
          - Traced 314 POS crashes at the busiest stores to a 32-bit memory limit in vendor software using AI-assisted diagnostics; shipped a workaround to 18 registers in 2 weeks.
          - Used AI-assisted analysis of decompiled vendor DLLs and fleet logs to identify a hidden reward dialog blocking the UI thread as the likely cause of loyalty-scan freezes at 32 of 272 restaurants. Documented 46 forced restarts in a week and gave the POS vendor the evidence for confirmation.
          - Enabled repeatable configuration audits across 343 locations by directing AI-assisted delivery of documented vendor integration tools with read-only safeguards.
          - Built an AI-assisted browser platform with human takeover and persistent sessions, unblocking automation while preserving manual intervention.
          - Replaced emailed vendor requests for sales-date corrections with an AI-run fix gated by a preview and a named approver.
          - Enabled AI-driven POS troubleshooting through AI-assisted development of remote-support tools with read-only defaults, approval controls and audit logs.
      - company: Sweetgreen
        position: Senior Lead Software Engineer
        start_date: 2025-09
        end_date: 2026-02
        location: Culver City, CA
        summary: Promoted from Lead Software Engineer.
        highlights:
          - Filled the Retail Technology leadership gap during an unplanned leave, giving the VP of Technology the technical guidance to limit revenue loss from POS issues.
          - Advanced a virtual POS proof of concept through cutover planning with Security; the planned cutover was postponed to add telemetry.
          - Upgraded Alteryx Server using a replacement host and a business-approved cutover, retaining the previous server for rollback.
          - Wrote and ran staged Ansible remediation to remove scheduled reboots across the managed POS inventory after the October 2025 end-of-day outage, preventing those reboots from interrupting end-of-day processing.
      - company: Sweetgreen
        position: Lead Software Engineer
        start_date: 2021-03
        end_date: 2025-08
        location: Culver City, CA
        summary: Promoted from Senior Software Engineer.
        highlights:
          - Built an Ansible and Fluent Bit pipeline for POS logs in Datadog, reaching 222 of 252 restaurants by May 2025.
          - Built AWS Lambda and Datadog monitoring for Meraki network loss and latency and Intune time-clock device health, giving teams visibility into restaurant connectivity and device status.
          - Implemented Cognito token caching for marketplace partners, reducing reported authentication costs from roughly $3,500 to $1,000 per month.
          - Codified AWS accounts in Terraform, rolled out Atlantis and view-only SSO access, and deployed AWS Config with ServiceNow integration across all accounts.
          - Built and managed a Terraform-based AWS Transfer SFTP service with isolated vendor folders, supporting Paytronix and PAR data exchange and coordinating onboarding with Security.
      - company: Sweetgreen
        position: Senior Software Engineer, Infrastructure
        start_date: 2019-08
        end_date: 2021-02
        location: Culver City, CA
        summary: Joined as Senior Engineer, Infrastructure, retitled Senior Software Engineer in March 2020.
        highlights:
          - Broke a locally run Terraform monorepo into smaller repositories deployed by CircleCI, each with its own backend state, reducing blast radius and increasing developer velocity.
          - Decoupled an Ember frontend from a Rails backend into a static single-page application to increase deployment frequency.
          - Built blue-green infrastructure enabling canary deployments and fast rollbacks using weighted target groups on AWS ALBs.
          - Initiated and documented a tech-wide on-call rotation in OpsGenie, leading the team to incrementally improve service runbooks.
          - Improved developer experience by introducing LocalStack, enabling hot reloading for local development, and granting bastion access via IAM.
          - Introduced Gruntwork's library of reusable, production-tested infrastructure modules to make the infrastructure codebase more sustainable.
          - Evangelized and led the Datadog implementation, centralizing observability and reducing costs.
          - Standardized infrastructure and deployment processes across 15+ services, shortening time to launch for new services and reducing onboarding overhead for new team members.
      - company: LearnZillion
        position: Senior Operations Engineer
        date: 2016 – 2019
        location: Remote
        highlights:
          - Migrated self-hosted EC2 instances of Elasticsearch, Redis, and Postgres to Amazon Elasticsearch Service, ElastiCache, and RDS, increasing reliability and decreasing overhead.
          - Reduced infrastructure costs by moving testing environments to ECS on Spot Fleet and leveraging short-term Reserved Instance contracts.
          - Improved developer experience with Docker for Mac and migrated CI from CircleCI 1.0 to 2.0.
      - company: Humanitarian OpenStreetMap Team
        position: Senior Systems Engineer
        date: 2016 – 2018
        location: Remote
        highlights:
          - Migrated applications from a hand-built cloud server on an outdated Docker version to a Docker Swarm cluster provisioned by Ansible and Terraform, with continuous deployment through CircleCI.
          - Led weekly community meetings to communicate changes to stakeholders.
      - company: Warby Parker
        position: Automation Engineer
        date: 2014 – 2016
        location: New York, NY
        highlights:
          - Designed a security-first AWS VPC and migrated Rackspace Public Cloud instances into it.
          - Moved to immutable infrastructure with auto scaling groups and blue-green and canary deployments using Packer, Ansible, Terraform, and Consul.
          - Auto-scaled application servers on CloudWatch CPU and memory metrics and worker servers on queue depth.
          - Monitored servers with collectd and services with Consul, alerting through Sensu.
          - Increased deployments from once a week to over 400 a month over two years.
          - Cut the infrastructure bill by over 40% by rightsizing servers and autoscaling.
    projects:
      - name: Self-hosted AI coding platform (fork of Vibe Kanban)
