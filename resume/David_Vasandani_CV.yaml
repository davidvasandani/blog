cv:
  name: David Vasandani
  headline: Solutions Engineer
  location: Los Angeles, CA
  email: david@vasandani.me
  website: https://david.vasandani.me/
  social_networks:
    - network: LinkedIn
      username: davidvasandani
    - network: GitHub
      username: davidvasandani
    - network: Mastodon
      username: '@davidvasandani@social.coop'
  sections:
    summary:
      - "Engineer and technical leader with over a decade building cloud infrastructure, improving software delivery and automating operations. Seven years at Sweetgreen, promoted three times, now leading IT Operations for a chain of nearly 300 restaurants while still building tools and integrations. Uses AI to get to root cause, even inside vendor software with no source code or logs. Most recently reverse-engineered the POS vendor's app to find why registers at the busiest stores crashed during lunch, and the fix cut crashes on those registers from about 7 a day to 2 in the following 11 days. Prototypes fast to unblock people, then builds the version that lasts so the fix isn't a one-off. Works with engineering, business teams and external partners to resolve problems and carry changes through rollout."
    experience:
      # Sweetgreen: one entry per role, newest first. Dates are the effective
      # dates in ChartHop's job history (Personal History tab).
      - company: Sweetgreen
        position: Senior Manager, IT Infrastructure & Innovation
        start_date: 2026-02
        end_date: present
        location: Culver City, CA
        summary: |-
          **Theme: Running IT operations, using AI to find problems and automate fixes.**
          Promoted from Senior Lead Software Engineer. Runs IT Operations, reporting to the VP of Technology. Manages a Senior Systems Engineer and two IT Operations Specialists.
        highlights:
          # Crash figures: the 2026-11-04 re-run compares Oct 13 to 23 with Oct 25 to Nov 4 on the registers in the rollout. Re-run with a longer window before the next release.
          - Registers at dozens of high-volume stores crashed during the lunch rush, 314 times in one month, and neither the vendor's lab nor ours could reproduce it. Used AI to map memory on live registers and reverse-engineered the POS executable. It is a 32-bit app that reserves memory for every CPU core, so the newest 20-thread registers ran out of address space first. Shipped a workaround that starts the app on fewer cores, freeing about 610 MB per register, to 18 registers in 2 weeks. Crashes on those registers fell from about 7 a day to 2 in the following 11 days.
          - The same work turned up loyalty-scan freezes, where a hidden reward dialog blocked the register screen until someone restarted it. Measured the fleet for a week, 53,617 scans, and found 46 freezes that only a restart cleared, at 32 of 272 restaurants. Used AI to decompile the vendor's loyalty DLL, found that it logs nothing when the reward dialog opens, and shared the findings with the vendor as evidence. Added three loyalty-step metrics to monitoring.
          - Store settings on the POS could only be read one store at a time in the vendor's web portal, through an API with no documentation, so nobody could check them across the fleet. Directed AI agents to catalog every call the portal's web app makes, sample 12 stores read-only and write it up as a 104-operation contract pinned to the vendor's build. The build fails on any call we haven't classified. The read-only tools generated from it audit all 343 locations in about 6 minutes, with credentials and personal data redacted.
          - When a store's end-of-day close failed, the next day's sales landed on the wrong business date, and the only fix was to email the POS vendor and wait. Reverse-engineered the vendor's correction form and built an AI agent that previews the fix, needs a named approver's sign-off, and reports unknown instead of retrying a change that can't be undone. Finance's controller reviewed the flow, and the agent has handled these corrections in-house since September 2026, 5 stores in its first week.
          - Sales totals read through the same vendor API showed the vendor's daily sales report overstating two stores by about $55K after corrections. Handed the vendor the side-by-side numbers. It regenerated the report, and both stores then matched the finance system to the penny.
          - Built a browser service for AI agents that stays logged in between runs. When a step needs a person, they take over the live session.
          - Built a tool that lets AI agents run PowerShell on POS devices and managers' back-office computers through our remote-access software. Integrated security cameras to check whether someone might be using the computer before making changes during business hours. Commands are read-only by default, changes need approval, and every command is logged.
          - DoorDash orders failed at three stores for two days, and the partner's first theory blamed a downstream system. Used order data and request traces to show the requests failed before reaching our services. DoorDash confirmed a missed configuration migration and fixed it.
          - Brought a paused restaurant back online on DoorDash with a manual REST API update. Used delivery logs to show repeated HTTP 500 responses from its webhook and escalated the evidence to DoorDash.
          - Validated Slack exports and shared-drive copies for the Spyce/Wonder data handoff under Legal's redaction criteria. Caught a copy failure and restored roughly 12,039 missing items before delivery. Fixed the Slack export so all 8,605 files could be parsed.
      - company: Sweetgreen
        position: Senior Lead Software Engineer
        start_date: 2025-09
        end_date: 2026-02
        location: Culver City, CA
        summary: |-
          **Theme: Covering for retail technology leadership through POS incidents and cutover planning.**
          Promoted from Lead Software Engineer.
        highlights:
          - Filled the Retail Technology leadership gap during an unplanned leave. Gave the VP of Technology the technical guidance to limit revenue loss from POS issues.
          - Took a virtual POS proof of concept through cutover planning with Security. The cutover was postponed to add telemetry first.
          - After the October 2025 end-of-day outage, wrote and ran staged Ansible changes that removed scheduled reboots from the POS devices Ansible manages, so those reboots no longer interrupt end-of-day processing.
      - company: Sweetgreen
        position: Lead Software Engineer
        start_date: 2021-03
        end_date: 2025-08
        location: Culver City, CA
        summary: |-
          **Theme: Connecting restaurant systems and making their health visible.**
          Promoted from Senior Software Engineer.
        highlights:
          - Restaurants could stop taking online orders while CPU and memory monitors stayed green, because there was no monitoring on the registers themselves. Led POS monitoring from proposal through Security and business reviews to fleet approval over nearly a year. Built the collection pipeline on an open-source collector instead of a paid per-host agent, and it shipped logs to Datadog from the fleet of nearly 300 restaurants.
          - The company needed centralized asset discovery and vulnerability scanning across every store, which meant connecting AWS to the store networks. Designed and implemented a hub-and-spoke network architecture for it, then worked through Security and business reviews for roughly ten months to get approval for fleet rollout.
          - Built monitoring for store network loss and latency and for Intune-managed time clocks, so teams could see which restaurants had network or device problems.
          - Marketplace partners' login costs rose after a pricing change on the identity service. Added token caching for those partners. Reported costs fell from about $3,500 to $1,000 a month.
          - Built and ran a managed SFTP service for file exchange with Paytronix and our POS vendor, with a separate folder for each vendor, and worked with Security to onboard them.
      - company: Sweetgreen
        position: Senior Software Engineer, Infrastructure
        start_date: 2019-08
        end_date: 2021-02
        location: Culver City, CA
        summary: |-
          **Theme: Making software delivery faster and safer.**
          Joined as Senior Engineer, Infrastructure. Retitled Senior Software Engineer in March 2020.
        highlights:
          - Infrastructure code lived in one Terraform monorepo that people applied from their own machines. Split it into smaller repositories, each with its own state and deployed by CI, so a bad change could break less and developers shipped faster.
          - Built blue-green infrastructure on weighted load-balancer target groups, so teams could run canary deploys and roll back fast.
          - Pushed for Datadog and led its rollout. Monitoring moved into one place, and costs went down.
          - Standardized infrastructure and deploys across 15+ services, so new services launched sooner and new engineers got up to speed faster.
      - company: LearnZillion
        position: Senior Operations Engineer
        date: 2016 – 2019
        location: Remote
        highlights:
          - Moved Elasticsearch, Redis and Postgres off self-managed servers onto managed cloud services, which were more reliable and less work to run.
      - company: Humanitarian OpenStreetMap Team
        position: Senior Systems Engineer
        date: 2016 – 2018
        location: Remote
        highlights:
          - Moved apps off a hand-built cloud server onto an automated container cluster deployed continuously from CI.
      - company: Warby Parker
        position: Automation Engineer
        date: 2014 – 2016
        location: New York, NY
        highlights:
          - Moved to immutable infrastructure with auto scaling groups and blue-green and canary deploys.
          - Increased deployments from once a week to over 400 a month over two years.
    projects:
      - name: Self-hosted AI coding platform (fork of Vibe Kanban)
        date: 2026
        summary: Built for my own use. Work adopted it, and I'm now onboarding my team.
        highlights:
          - Connected it to Jira, Slack, GitHub, AWS and ChatGPT, so agents can finish work without someone logging in for them or copying tickets over by hand.
          - The upstream tool ran every agent on one machine, so a restart lost running work. Grew it into a 6-server cluster where agent work survives restarts and the cluster opens its own repair tickets.
          - Designed it and directed Claude and Codex agents to build it. Every change starts as a written spec, then gets a review and automated tests before release.
      - name: SitePing web feedback platform
        date: 2026
        highlights:
          - Made an open-source website feedback tool work on phones, directing AI agents to write the change and 48 regression tests. Upstream shipped it in v0.11.0.
      - name: Household content and workflow platform
        summary: Personal project, built with AI coding agents.
        highlights:
          - Built resumable book and magazine imports for a household library. Extracted EPUB metadata, checked file formats and used SHA-256 hashes to identify duplicates, with controls to recover failed runs.
          - Restored stalled content imports by fixing credentials and running recovery triggers. Imported 62 new items and requeued 63 failed downloads.
          - Automated email triage. Jev sorts each message into Johnny.Decimal labels, a separate check confirms each action, and my corrections tune it.
    skills:
      - label: AI agents & automation
        details: Agent tool development, browser automation, approval controls, audit logging
      - label: APIs & troubleshooting
        details: REST APIs, webhooks, request tracing, log analysis, reverse engineering
      - label: Infrastructure & delivery
        details: Terraform, Terragrunt, Ansible, Packer, Docker, CircleCI, blue-green and canary deployments
      - label: AWS
        details: Lambda, Cognito, IAM, ALB, EC2, RDS, ElastiCache, Transfer Family
      - label: IT operations & observability
        details: PowerShell, Intune, Meraki, Datadog, Fluent Bit, incident response, on-call runbooks
      - label: Data & content workflows
        details: Export validation, metadata extraction, deduplication, resumable imports
      - label: Technical leadership
        details: Team management, vendor escalation, stakeholder communication, rollout and rollback planning
